<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario y Contacto</title>
    <style>
        /* Estilos generales para el contenedor principal */
        .info-container {
            font-family: Arial, sans-serif; /* Usamos una fuente sans-serif limpia */
            width: 100px; /* Ancho ajustable */
            padding: 20px;
            text-align: center; /* Centrar todo el texto */
            color: #1a3c7c; /* Color de texto azul oscuro principal */
            position:fixed; /* Para el botón de flecha */
            left: 40px;
            bottom: 0;

            /* Fondo: Un degradado sutil de azul claro a blanco para imitar la imagen */
            background: linear-gradient(135deg, #e6f7ff 0%, #ffffff 100%);
            border-radius: 10px; /* Bordes redondeados */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Sombra suave */
            margin: 10px auto; /* Centrar en la página */
        }

        /* Estilo para los títulos con fondo amarillo */
        .highlight-title {
            background-color: #ffd700; /* Fondo amarillo brillante */
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            margin-top: 5px;
        }

        .highlight-title h2 {
            margin: 0;
            font-size: 11px;
            color: #1a3c7c; /* Texto azul oscuro dentro del amarillo */
            font-weight: bold;
        }

        /* Estilos para el texto de los detalles */
        .details p {
            margin: 5px 0;
            font-size: 10px;
        }

        .details .day {
            font-weight: bold;
            font-size: 10px;
        }

        /* Estilo para los números de teléfono */
        .contact-details p {
            margin: 10px 0;
            font-size: 12px;
            font-weight: bold;
        }

        /* Enlaces para los teléfonos (para hacer clic en móvil) */
        .contact-details a {
            text-decoration: none;
            color: inherit; /* Mantiene el color del texto */
        }

       
        

        /* Efecto al pasar el mouse por encima de la flecha */
        .arrow-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="info-container">
        <!-- Sección de Horario -->
        <div class="highlight-title">
            <h2>HORARIO</h2>
        </div>
        <div class="details">
            <p class="day">LUNES A VIERNES</p>
            <p>8:00AM - 3:00PM</p>
            <div style="margin-top: 10px;"></div> <!-- Espacio extra -->
            
            <p class="day">SÁBADOS</p>
            <p>8:00AM - 12:00M</p>
        </div>
        <div style="margin-top:10px;"></div> <!-- Espacio grande entre secciones -->
        <!-- Sección de Contáctanos -->
        <div class="highlight-title">
            <h2>CONTÁCTANOS</h2>
        </div>
        <div class="contact-details">
            <p>0800-SUCREGAS</p>
           
        </div>
    </div>

</body>
</html>
